<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKODA OCTAVIA 1U — Configurador ModsNation Style</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='20' width='80' height='55' rx='12' fill='%23C9A86A'/><rect x='28' y='10' width='44' height='20' rx='6' fill='%230F172A'/><circle cx='27' cy='68' r='10' fill='%230F172A'/><circle cx='73' cy='68' r='10' fill='%230F172A'/></svg>">
<script src="https://cdn.tailwindcss.com">
// accordion informes: abrir uno cierra los demas (compat total)
document.addEventListener('click', function(e){
  var s = e.target.closest('#informesAccordion summary');
  if(!s) return;
  var d = s.closest('details');
  document.querySelectorAll('#informesAccordion details').forEach(function(o){ if(o!==d) o.removeAttribute('open'); });
});
</script>
</body>
</html>
